<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neurons guide</title>
  <meta name="description" content="How to install and use Neurons, the live view of what Claude Code does in a repository.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%23eb6c36'/%3E%3Ccircle cx='6' cy='8' r='2.5' fill='%232d3142'/%3E%3Ccircle cx='26' cy='9' r='2.5' fill='%232d3142'/%3E%3Ccircle cx='24' cy='25' r='2.5' fill='%232d3142'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!--
    User guide served by the viewer at GET /help (copied to dist/docs by scripts/build-docs.mjs).
    Every visible string lives in docs/i18n/guide.{en,es}.json and is applied through
    data-i18n (text), data-i18n-html (trusted markup from those files) and data-i18n-attr.
    The dictionaries are also embedded below so the page works from file://, where fetch is
    blocked; run `node scripts/sync-guide-i18n.mjs` after editing them (a unit test checks it).
  -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-paper:       #f5f5f5;
      --color-paper-2:     #ececec;
      --color-ink:         #2d3142;
      --color-muted:       #4f5d75;
      --color-soft:        #7a8399;
      --color-rule:        rgba(45,49,66,0.12);
      --color-rule-solid:  rgba(79,93,117,0.25);
      --color-accent:      #eb6c36;
      --color-accent-tint: rgba(235,108,54,0.08);
      --color-link:        #2e5aa8;
      --font-sans:   'Geist', system-ui, sans-serif;
      --font-serif:  'Instrument Serif', 'Times New Roman', serif;
      --font-mono:   'Geist Mono', ui-monospace, Menlo, monospace;
      --bar-h: 56px;
    }

    html { scroll-behavior: smooth; scroll-padding-top: calc(var(--bar-h) + 16px); }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      line-height: 1.6;
      -webkit-text-size-adjust: 100%;
    }
    a { color: var(--color-link); text-underline-offset: 2px; }
    a:hover { color: var(--color-accent); }
    :focus-visible { outline: 3px solid var(--color-accent); outline-offset: 2px; }
    code {
      font-family: var(--font-mono);
      font-size: 0.85em;
      background: rgba(45,49,66,0.06);
      border-radius: 4px;
      padding: 0.05em 0.35em;
      overflow-wrap: anywhere;
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    .skip {
      position: absolute; left: 16px; top: -48px; z-index: 20;
      background: var(--color-ink); color: var(--color-paper);
      padding: 8px 12px; border-radius: 4px; font: 500 0.8rem/1 var(--font-sans);
    }
    .skip:focus { top: 8px; color: var(--color-paper); }

    /* Top bar */
    .bar {
      position: sticky; top: 0; z-index: 10;
      height: var(--bar-h);
      background: var(--color-paper);
      border-bottom: 1px solid var(--color-rule);
    }
    .bar-inner {
      max-width: 1072px; height: 100%; margin: 0 auto; padding: 0 16px;
      display: flex; align-items: center; gap: 1.5rem;
    }
    .brand {
      display: flex; align-items: center; gap: 0.55rem;
      font-family: var(--font-serif); font-size: 1.45rem; line-height: 1;
      color: var(--color-ink); text-decoration: none;
    }
    .brand svg { width: 22px; height: 22px; flex: none; }
    .nav { display: flex; gap: 1.25rem; margin-left: auto; font: 500 0.72rem/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; }
    .nav a { color: var(--color-muted); text-decoration: none; padding: 6px 0; }
    .nav a:hover { color: var(--color-accent); }
    .lang { display: flex; border: 1px solid var(--color-rule-solid); border-radius: 4px; overflow: hidden; flex: none; }
    .lang button {
      min-width: 40px; min-height: 32px; padding: 0 10px;
      border: 0; background: transparent; color: var(--color-muted);
      font: 600 0.72rem/1 var(--font-mono); letter-spacing: 0.06em; cursor: pointer;
    }
    .lang button + button { border-left: 1px solid var(--color-rule-solid); }
    .lang button[aria-pressed="true"] { background: var(--color-ink); color: var(--color-paper); }
    .lang button:focus-visible { outline-offset: -3px; }

    /* Layout */
    main { padding: 0 16px 5rem; }
    .wrap { max-width: 1040px; margin: 0 auto; }
    .col { max-width: 720px; }
    section.chapter { margin-top: 5rem; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted);
      margin-bottom: 0.75rem;
    }
    h1 {
      font-family: var(--font-serif); font-weight: 400;
      font-size: clamp(2.2rem, 4vw + 1rem, 3.6rem);
      letter-spacing: -0.02em; line-height: 1.05; margin-bottom: 1.25rem;
    }
    h2 {
      font-family: var(--font-serif); font-weight: 400;
      font-size: clamp(1.7rem, 1.6vw + 1rem, 2.3rem);
      letter-spacing: -0.01em; line-height: 1.15; margin-bottom: 0.75rem;
    }
    h3 {
      font-family: var(--font-serif); font-weight: 400;
      font-size: 1.45rem; line-height: 1.2; letter-spacing: -0.005em;
    }
    p { max-width: 68ch; }
    p + p { margin-top: 0.75rem; }
    .lead { font-size: 1.08rem; color: var(--color-muted); }
    .lead + .lead { margin-top: 0.9rem; }
    .note { font-size: 0.88rem; color: var(--color-muted); margin-top: 1rem; }
    .req {
      margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--color-rule);
      font: 500 0.78rem/1.5 var(--font-mono); color: var(--color-muted);
    }

    /* Hero */
    .hero { padding-top: 4rem; }
    .hero figure { margin-top: 2.5rem; }
    .hero img {
      display: block; width: 100%; height: auto; aspect-ratio: 16 / 10;
      border: 1px solid var(--color-rule-solid); border-radius: 6px; background: #05060a;
    }
    figcaption { margin-top: 0.75rem; font-size: 0.82rem; line-height: 1.5; color: var(--color-muted); max-width: 80ch; }

    /* Code blocks and copy buttons */
    .code { position: relative; margin-top: 1rem; }
    pre {
      background: var(--color-paper-2);
      border: 1px solid var(--color-rule);
      border-radius: 6px;
      padding: 0.9rem 1rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      font: 400 0.8rem/1.6 var(--font-mono);
      color: var(--color-ink);
      tab-size: 2;
    }
    pre code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; }
    .code pre { padding-right: 5.5rem; }
    .code.prompt pre, pre.wrap { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 26rem; overflow-y: auto; }
    .copy-btn {
      position: absolute; top: 8px; right: 8px;
      min-height: 30px; padding: 0 10px;
      border: 1px solid var(--color-rule-solid); border-radius: 4px;
      background: var(--color-paper); color: var(--color-ink);
      font: 600 0.68rem/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer;
    }
    .copy-btn:hover { border-color: var(--color-accent); color: var(--color-accent); }
    .copy-btn.done { border-color: var(--color-accent); color: var(--color-accent); }

    /* Steps */
    ol.steps { list-style: none; counter-reset: step; margin-top: 2rem; }
    ol.steps > li {
      counter-increment: step;
      display: grid; grid-template-columns: 2.75rem minmax(0, 1fr); gap: 0 0.75rem;
      padding: 1.5rem 0; border-top: 1px solid var(--color-rule);
    }
    ol.steps > li::before {
      content: counter(step);
      font-family: var(--font-serif); font-size: 2.1rem; line-height: 1; color: var(--color-accent);
    }
    ol.steps > li > div { min-width: 0; }
    ol.steps h3 { font-size: 1.3rem; margin-bottom: 0.4rem; }
    .two-up { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }

    /* FAQ */
    .faq-tools { margin-top: 2rem; max-width: 720px; }
    .faq-tools label { display: block; }
    .search {
      position: relative; margin-top: 0.4rem;
    }
    .search svg { position: absolute; left: 12px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--color-soft); pointer-events: none; }
    .search input {
      width: 100%; min-height: 44px; padding: 0 12px 0 38px;
      border: 1px solid var(--color-rule-solid); border-radius: 6px;
      background: #fff; color: var(--color-ink);
      font: 400 1rem/1.2 var(--font-sans);
    }
    .search input::placeholder { color: var(--color-soft); }
    .search input:focus-visible { outline: 3px solid var(--color-accent); outline-offset: 1px; border-color: transparent; }
    .faq-empty { margin-top: 1.5rem; color: var(--color-muted); font-style: italic; font-family: var(--font-serif); font-size: 1.2rem; }
    .faq-group { margin-top: 3rem; max-width: 760px; }
    .faq-group > h3 { margin-bottom: 0.5rem; }
    details.faq { border-top: 1px solid var(--color-rule); scroll-margin-top: calc(var(--bar-h) + 16px); }
    .faq-group details.faq:last-of-type { border-bottom: 1px solid var(--color-rule); }
    details.faq > summary {
      list-style: none; cursor: pointer;
      display: flex; align-items: baseline; gap: 1rem;
      padding: 0.95rem 0; font-weight: 500; font-size: 1.02rem; line-height: 1.4;
    }
    details.faq > summary::-webkit-details-marker { display: none; }
    details.faq > summary::after {
      content: "+"; margin-left: auto; flex: none;
      font: 400 1.3rem/1 var(--font-mono); color: var(--color-soft);
      transition: transform 160ms cubic-bezier(.2,.8,.2,1);
    }
    details.faq[open] > summary::after { content: "\2212"; color: var(--color-accent); }
    details.faq > summary:hover { color: var(--color-accent); }
    details.faq > summary:focus-visible { outline-offset: 0; }
    .answer { padding: 0 0 1.4rem; max-width: 68ch; }
    .answer ul, .answer ol { margin: 0.75rem 0 0 1.25rem; }
    .answer li + li { margin-top: 0.35rem; }
    .answer li::marker { color: var(--color-soft); }
    .answer .code { margin-top: 0.75rem; }
    .answer .code + p, .answer .table-wrap + p { margin-top: 0.75rem; }
    .faq-link {
      display: inline-block; margin-top: 0.9rem;
      font: 500 0.68rem/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--color-soft); text-decoration: none;
    }
    .faq-link:hover { color: var(--color-accent); }

    /* Tables */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 0.9rem; }
    table { border-collapse: collapse; width: 100%; font-size: 0.88rem; line-height: 1.45; }
    th {
      text-align: left; font: 500 0.66rem/1.3 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--color-muted); padding: 0.5rem 0.75rem 0.5rem 0; border-bottom: 1px solid var(--color-rule-solid);
    }
    td { padding: 0.55rem 0.75rem 0.55rem 0; border-bottom: 1px solid var(--color-rule); vertical-align: top; }
    td:first-child { white-space: nowrap; }
    table.colors td:last-child { min-width: 14rem; }
    .sw {
      display: inline-block; width: 0.8rem; height: 0.8rem; border-radius: 50%;
      margin-right: 0.5rem; vertical-align: -0.08rem; background: var(--c);
      border: 1px solid rgba(45,49,66,0.25);
    }
    .sw-read { --c: #22d3ee; } .sw-search { --c: #3b82f6; } .sw-edit { --c: #f59e0b; }
    .sw-create { --c: #22c55e; } .sw-delete { --c: #ef4444; } .sw-move { --c: #f472b6; }
    .sw-context { --c: #a855f7; } .sw-bash { --c: #e2e8f0; } .sw-skill { --c: #fb923c; }
    .sw-mcp { --c: #2dd4bf; } .sw-tool { --c: #94a3b8; } .sw-subagent { --c: #fde047; }
    .sw-fail { --c: #6b7280; } .sw-external { --c: #475569; }
    .status {
      display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; white-space: nowrap;
      font: 600 0.66rem/1.4 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase;
    }
    .status-ok { background: var(--color-ink); color: var(--color-paper); }
    .status-mid { border: 1px solid var(--color-ink); color: var(--color-ink); }
    .status-low { border: 1px dashed var(--color-soft); color: var(--color-muted); }

    footer { padding: 0 16px 3rem; }
    .foot {
      max-width: 1040px; margin: 0 auto; padding-top: 1.5rem;
      border-top: 1px solid var(--color-rule);
      display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem;
      font: 500 0.72rem/1.5 var(--font-mono); color: var(--color-muted);
    }
    footer a { color: var(--color-muted); }
    noscript p { margin-top: 1rem; font: 500 0.8rem/1.4 var(--font-mono); color: var(--color-muted); }

    @media (min-width: 900px) {
      .two-up { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 3rem; }
    }
    @media (max-width: 640px) {
      .nav { display: none; }
      .lang { margin-left: auto; }
      .hero { padding-top: 2.5rem; }
      section.chapter { margin-top: 3.5rem; }
      ol.steps > li { grid-template-columns: 2rem minmax(0, 1fr); }
      ol.steps > li::before { font-size: 1.7rem; }
      td:first-child { white-space: normal; }
      table.colors td:first-child { white-space: nowrap; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#content" data-i18n="a11y.skip"></a>

  <header class="bar">
    <div class="bar-inner">
      <a class="brand" href="#top" aria-label="Neurons">
        <svg viewBox="0 0 32 32" aria-hidden="true"><line x1="16" y1="16" x2="6" y2="8" stroke="#2d3142" stroke-opacity=".35"/><line x1="16" y1="16" x2="26" y2="9" stroke="#2d3142" stroke-opacity=".35"/><line x1="16" y1="16" x2="24" y2="25" stroke="#2d3142" stroke-opacity=".35"/><circle cx="16" cy="16" r="5" fill="#eb6c36"/><circle cx="6" cy="8" r="2.5" fill="#2d3142"/><circle cx="26" cy="9" r="2.5" fill="#2d3142"/><circle cx="24" cy="25" r="2.5" fill="#2d3142"/></svg>
        Neurons
      </a>
      <nav class="nav" data-i18n-attr="aria-label:nav.aria">
        <a href="#setup-ai" data-i18n="nav.setup"></a>
        <a href="#use" data-i18n="nav.use"></a>
        <a href="#faq" data-i18n="nav.faq"></a>
        <a class="arch-link" href="architecture.html" data-i18n="nav.architecture"></a>
      </nav>
      <div class="lang" role="group" data-i18n-attr="aria-label:lang.label">
        <button type="button" data-lang="en" aria-pressed="false" data-i18n-attr="title:lang.enTitle">EN</button>
        <button type="button" data-lang="es" aria-pressed="false" data-i18n-attr="title:lang.esTitle">ES</button>
      </div>
    </div>
  </header>

  <main id="content">
    <div class="wrap">
      <section class="hero" id="top">
        <div class="col">
          <p class="eyebrow" data-i18n="hero.eyebrow"></p>
          <h1 data-i18n="hero.title"></h1>
          <p class="lead" data-i18n-html="hero.lead"></p>
          <p class="lead" data-i18n="hero.lead2"></p>
          <p class="req" data-i18n="hero.req"></p>
          <noscript><p>This page needs JavaScript to show its text and switch languages. / Esta página necesita JavaScript para mostrar el texto y cambiar de idioma.</p></noscript>
        </div>
        <figure>
          <img src="img/live.png" width="1600" height="1000" data-i18n-attr="alt:hero.imgAlt" alt="">
          <figcaption data-i18n="hero.caption"></figcaption>
        </figure>
      </section>

      <section class="chapter" id="setup-ai">
        <div class="col">
          <h2 data-i18n="ai.title"></h2>
          <p data-i18n-html="ai.lead"></p>
          <div class="code prompt"><pre><code data-i18n="ai.prompt"></code></pre></div>
          <p class="note" data-i18n-html="ai.note"></p>
        </div>
      </section>

      <section class="chapter" id="setup-manual">
        <div class="col">
          <h2 data-i18n="manual.title"></h2>
          <p class="lead" data-i18n="manual.lead"></p>
          <ol class="steps">
            <li><div>
              <h3 data-i18n="manual.s1.title"></h3>
              <div class="code"><pre><code>git clone &lt;repo-url&gt; ~/neurons
cd ~/neurons
npm install
npm run build</code></pre></div>
              <p class="note" data-i18n-html="manual.s1.body"></p>
            </div></li>
            <li><div>
              <h3 data-i18n="manual.s2.title"></h3>
              <div class="code"><pre><code>npm link</code></pre></div>
              <p class="note" data-i18n-html="manual.s2.body"></p>
            </div></li>
            <li><div>
              <h3 data-i18n="manual.s3.title"></h3>
              <div class="code"><pre><code>neu --version
neu doctor</code></pre></div>
              <p class="note" data-i18n-html="manual.s3.body"></p>
            </div></li>
            <li><div>
              <h3 data-i18n="manual.s4.title"></h3>
              <p class="note" data-i18n-html="manual.s4.body"></p>
              <div class="two-up">
                <div class="code"><pre><code>"bin": {
  "nr": "./dist/cli.mjs"
}</code></pre></div>
                <div class="code"><pre><code>npm unlink -g neurons-cli
npm link</code></pre></div>
              </div>
            </div></li>
          </ol>
        </div>
      </section>

      <section class="chapter" id="use">
        <div class="col">
          <h2 data-i18n="use.title"></h2>
          <ol class="steps">
            <li><div>
              <h3 data-i18n="use.s1.title"></h3>
              <div class="code"><pre><code data-i18n="use.s1.code"></code></pre></div>
              <p class="note" data-i18n-html="use.s1.body"></p>
            </div></li>
            <li><div>
              <h3 data-i18n="use.s2.title"></h3>
              <div class="code"><pre><code data-i18n="use.s2.code"></code></pre></div>
              <p class="note" data-i18n-html="use.s2.body"></p>
            </div></li>
            <li><div>
              <h3 data-i18n="use.s3.title"></h3>
              <div class="code"><pre><code>neu stop</code></pre></div>
              <p class="note" data-i18n-html="use.s3.body"></p>
            </div></li>
          </ol>
          <p class="note" data-i18n-html="use.more"></p>
        </div>
      </section>

      <section class="chapter" id="faq">
        <div class="col">
          <h2 data-i18n="faq.title"></h2>
          <p class="lead" data-i18n="faq.lead"></p>
        </div>
        <div class="faq-tools">
          <label class="eyebrow" for="faq-search" data-i18n="faq.searchLabel"></label>
          <div class="search">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.75"/><line x1="10.5" y1="10.5" x2="14" y2="14" stroke-linecap="round"/></svg>
            <input id="faq-search" type="search" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:faq.searchPlaceholder">
          </div>
          <p class="faq-empty" id="faq-empty" role="status" hidden data-i18n="faq.empty"></p>
        </div>

        <div class="faq-group">
          <h3 data-i18n="faq.group.start"></h3>
          <details class="faq" id="faq-what"><summary data-i18n="faq.what.q"></summary><div class="answer" data-i18n-html="faq.what.a"></div></details>
          <details class="faq" id="faq-cli"><summary data-i18n="faq.cli.q"></summary><div class="answer" data-i18n-html="faq.cli.a"></div></details>
          <details class="faq" id="faq-install"><summary data-i18n="faq.install.q"></summary><div class="answer" data-i18n-html="faq.install.a"></div></details>
          <details class="faq" id="faq-other-repo"><summary data-i18n="faq.other-repo.q"></summary><div class="answer" data-i18n-html="faq.other-repo.a"></div></details>
        </div>

        <div class="faq-group">
          <h3 data-i18n="faq.group.see"></h3>
          <details class="faq" id="faq-nodes"><summary data-i18n="faq.nodes.q"></summary><div class="answer" data-i18n-html="faq.nodes.a"></div></details>
          <details class="faq" id="faq-colors"><summary data-i18n="faq.colors.q"></summary><div class="answer" data-i18n-html="faq.colors.a"></div></details>
          <details class="faq" id="faq-disconnected"><summary data-i18n="faq.disconnected.q"></summary><div class="answer" data-i18n-html="faq.disconnected.a"></div></details>
          <details class="faq" id="faq-subagents"><summary data-i18n="faq.subagents.q"></summary><div class="answer" data-i18n-html="faq.subagents.a"></div></details>
        </div>
